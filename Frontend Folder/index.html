<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Industry Financial Benchmarks</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #12212b;
    --sub: #5b6b74;
    --line: #dfe6ea;
    --bg: #f6f8f9;
    --card: #ffffff;
    --accent: #0f7a63;
    --accent-dark: #0a5a49;
    --warn-bg: #fff6e5;
    --warn-border: #e8c674;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--accent-dark);
    color: white;
    padding: 28px 32px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
  header p { margin: 0; opacity: 0.85; font-size: 14px; }

  .controls {
    max-width: 1000px;
    margin: -20px auto 0;
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 20px 24px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
    position: relative;
  }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .03em; }
  select, input {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; font-size: 14px;
  }
  button {
    background: var(--accent); color: white; border: none; border-radius: 7px;
    padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }

  main { max-width: 1000px; margin: 28px auto 60px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 10px; border: 1px solid var(--line);
    padding: 22px 24px; margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card .caption { margin: 0 0 16px; font-size: 12.5px; color: var(--sub); }
  .source-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
    padding: 2px 8px; border-radius: 20px; margin-left: 8px; text-transform: uppercase;
  }
  .source-tag.real { background: #e3f3ef; color: var(--accent-dark); }
  .source-tag.modeled { background: var(--warn-bg); color: #8a6d1f; border: 1px solid var(--warn-border); }
  .source-tag.calculated { background: #e8eefb; color: #1d4ed8; border: 1px solid #b9cdf5; }
  .trend-up { color: var(--accent-dark); }
  .trend-down { color: #b3261e; }
  .calc-box {
    background: #f4f7fe; border: 1px solid #cdd9f7; border-radius: 8px;
    padding: 14px 16px; font-size: 13px; line-height: 1.55; color: #1e2a4a; margin-top: 14px;
  }
  .calc-box .calc-value { font-size: 20px; font-weight: 700; color: #1d4ed8; margin-bottom: 4px; }

  .glance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .glance-stat { text-align: left; }
  .glance-stat .value { font-size: 22px; font-weight: 700; }
  .glance-stat .label { font-size: 12px; color: var(--sub); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--sub); font-weight: 600; font-size: 11.5px; text-transform: uppercase; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
  tr.subtotal td { font-weight: 700; }

  .disclaimer {
    background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px;
    padding: 16px 18px; font-size: 12.5px; line-height: 1.55; color: #5c4a12;
  }
  .disclaimer h3 { margin: 0 0 6px; font-size: 13px; }

  .error-box {
    background: #fdecea; border: 1px solid #f3b7ae; color: #7a271a; padding: 16px 18px;
    border-radius: 8px; font-size: 13.5px;
  }
  .loading { text-align: center; padding: 40px; color: var(--sub); }
  canvas { max-height: 280px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>Industry Financial Benchmarks</h1>
  <p>State &amp; national industry benchmarks built from live U.S. Census Bureau data, with modeled financial detail.</p>
</header>

<div class="controls">
  <div class="field">
    <label for="stateSelect">State</label>
    <select id="stateSelect"></select>
  </div>
  <div class="field" style="flex: 2;">
    <label for="naicsInput">Industry</label>
    <input list="naicsList" id="naicsInput" placeholder="Search industry (e.g. restaurants, plumbing, retail)" />
    <datalist id="naicsList"></datalist>
  </div>
  <div class="field" style="flex: 0 0 auto;">
    <label>&nbsp;</label>
    <button id="generateBtn">Generate Report</button>
  </div>
</div>

<main id="reportRoot">
  <div class="loading">Select a state and industry, then click Generate Report.</div>
</main>

<script>
const API = "";
let naicsMap = {}; // label -> code

// Static state list (mirrors backend/states.py). Embedded directly rather
// than fetched from /api/states so the dropdown always populates even if
// the backend is unreachable, misconfigured, or this file is opened
// directly (file://) instead of served through Flask.
const STATES = [
  ["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],
  ["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["DC","District of Columbia"],
  ["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],
  ["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],
  ["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],
  ["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],
  ["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],
  ["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],
  ["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],
  ["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],
  ["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"],
].sort((a, b) => a[1].localeCompare(b[1]));

function loadStates() {
  const sel = document.getElementById("stateSelect");
  sel.innerHTML = STATES.map(([code, name]) => `<option value="${code}">${name}</option>`).join("");
}

// Static NAICS picker list (mirrors backend/naics_codes.py). Embedded and
// filtered client-side, same reasoning as STATES above: the industry
// search box should work instantly without depending on a live fetch to
// the Flask backend. Only "Generate Report" needs the backend (it calls
// the live Census API).
const NAICS_CODES = [
  ["236115","New Single-Family Housing Construction"],
  ["236220","Commercial and Institutional Building Construction"],
  ["237310","Highway, Street, and Bridge Construction"],
  ["238110","Poured Concrete Foundation and Structure Contractors"],
  ["238160","Roofing Contractors"],
  ["238210","Electrical Contractors"],
  ["238220","Plumbing, Heating, and Air-Conditioning Contractors"],
  ["238350","Finish Carpentry Contractors"],
  ["311811","Retail Bakeries"],
  ["312120","Breweries"],
  ["321912","Cut Stock, Resawing Lumber, and Planing"],
  ["332710","Machine Shops"],
  ["337110","Wood Kitchen Cabinet and Countertop Manufacturing"],
  ["339999","All Other Miscellaneous Manufacturing"],
  ["423430","Computer and Computer Peripheral Equipment Wholesalers"],
  ["423840","Industrial Supplies Wholesalers"],
  ["424410","General Line Grocery Wholesalers"],
  ["424690","Other Chemical and Allied Products Wholesalers"],
  ["441110","New Car Dealers"],
  ["441120","Used Car Dealers"],
  ["444110","Home Centers"],
  ["444230","Outdoor Power Equipment Stores"],
  ["445110","Supermarkets and Other Grocery Retailers"],
  ["445230","Fruit and Vegetable Retailers"],
  ["446110","Pharmacies and Drug Retailers"],
  ["446120","Cosmetics, Beauty Supplies, and Perfume Retailers"],
  ["447110","Gasoline Stations with Convenience Stores"],
  ["448110","Women's Clothing Retailers"],
  ["448120","Men's Clothing Retailers"],
  ["448140","Family Clothing Retailers"],
  ["451110","Sporting Goods Retailers"],
  ["451211","Book Retailers"],
  ["452210","Department Stores"],
  ["453220","Gift, Novelty, and Souvenir Retailers"],
  ["453910","Pet and Pet Supplies Retailers"],
  ["454110","Electronic Shopping and Mail-Order Houses"],
  ["484110","General Freight Trucking, Local"],
  ["484230","Specialized Freight (except Used Goods) Trucking, Long-Distance"],
  ["485310","Taxi and Ridesharing Services"],
  ["488510","Freight Transportation Arrangement"],
  ["493110","General Warehousing and Storage"],
  ["511210","Software Publishers"],
  ["512110","Motion Picture and Video Production"],
  ["515210","Media Streaming Distribution Services"],
  ["519290","Web Search Portals and All Other Information Services"],
  ["522110","Commercial Banking"],
  ["523930","Investment Advice"],
  ["524210","Insurance Agencies and Brokerages"],
  ["531210","Offices of Real Estate Agents and Brokers"],
  ["531311","Residential Property Managers"],
  ["532120","Truck, Utility Trailer, and RV Rental and Leasing"],
  ["541110","Offices of Lawyers"],
  ["541211","Offices of Certified Public Accountants"],
  ["541330","Engineering Services"],
  ["541511","Custom Computer Programming Services"],
  ["541512","Computer Systems Design Services"],
  ["541613","Marketing Consulting Services"],
  ["541810","Advertising Agencies"],
  ["541921","Photography Studios, Portrait"],
  ["541930","Translation and Interpretation Services"],
  ["561320","Temporary Help Services"],
  ["561440","Collection Agencies"],
  ["561621","Security Systems Services (except Locksmiths)"],
  ["561730","Landscaping Services"],
  ["561740","Carpet and Upholstery Cleaning Services"],
  ["561790","Other Services to Buildings and Dwellings"],
  ["611110","Elementary and Secondary Schools"],
  ["611420","Computer Training"],
  ["611620","Sports and Recreation Instruction"],
  ["621111","Offices of Physicians (except Mental Health Specialists)"],
  ["621210","Offices of Dentists"],
  ["621310","Offices of Chiropractors"],
  ["621340","Offices of Physical, Occupational and Speech Therapists"],
  ["621610","Home Health Care Services"],
  ["622110","General Medical and Surgical Hospitals"],
  ["623110","Nursing Care Facilities (Skilled Nursing Facilities)"],
  ["624410","Child Day Care Services"],
  ["711130","Musical Groups and Artists"],
  ["713940","Fitness and Recreational Sports Centers"],
  ["713990","All Other Amusement and Recreation Industries"],
  ["721110","Hotels (except Casino Hotels) and Motels"],
  ["722511","Full-Service Restaurants"],
  ["722513","Limited-Service Restaurants"],
  ["722515","Snack and Nonalcoholic Beverage Bars"],
  ["811111","General Automotive Repair"],
  ["811310","Commercial and Industrial Machinery and Equipment Repair"],
  ["812111","Barber Shops"],
  ["812112","Beauty Salons"],
  ["812113","Nail Salons"],
  ["812191","Diet and Weight Reducing Centers"],
  ["812210","Funeral Homes and Funeral Services"],
  ["812320","Drycleaning and Laundry Services (except Coin-Operated)"],
  ["812910","Pet Care (except Veterinary) Services"],
  ["812921","Photofinishing Laboratories (except One-Hour)"],
  ["813110","Religious Organizations"],
];

function searchNaics(q) {
  const query = (q || "").trim().toLowerCase();
  let results;
  if (!query) {
    results = NAICS_CODES.slice(0, 25);
  } else if (/^\d+$/.test(query)) {
    results = NAICS_CODES.filter(([code]) => code.startsWith(query)).slice(0, 25);
  } else {
    results = NAICS_CODES.filter(([, label]) => label.toLowerCase().includes(query)).slice(0, 25);
  }
  const list = document.getElementById("naicsList");
  naicsMap = {};
  list.innerHTML = results.map(([code, label]) => {
    const display = `${label} (${code})`;
    naicsMap[display] = code;
    return `<option value="${display}"></option>`;
  }).join("");
}

const naicsInputEl = document.getElementById("naicsInput");

naicsInputEl.addEventListener("input", (e) => {
  searchNaics(e.target.value);
});

// Once the box holds an exact match (a previously picked suggestion),
// browsers won't reopen the datalist dropdown on a plain click/focus --
// only on an actual edit. Clear the field on focus so there's always
// something to "complete," which reliably reopens the suggestion list
// without requiring a full page reload.
naicsInputEl.addEventListener("focus", () => {
  if (naicsInputEl.value.trim()) {
    naicsInputEl.dataset.previousValue = naicsInputEl.value;
    naicsInputEl.value = "";
    searchNaics("");
  }
});

// If the user clicks away without picking anything, restore what was
// there before so a stray focus/blur doesn't silently wipe a valid pick.
naicsInputEl.addEventListener("blur", () => {
  if (!naicsInputEl.value.trim() && naicsInputEl.dataset.previousValue) {
    naicsInputEl.value = naicsInputEl.dataset.previousValue;
  }
});

document.getElementById("generateBtn").addEventListener("click", generateReport);

function money(v, decimals = 0) {
  if (v === null || v === undefined) return "—";
  return "$" + Number(v).toLocaleString(undefined, { maximumFractionDigits: decimals });
}
function pct(v) {
  if (v === null || v === undefined) return "—";
  return (v * 100).toFixed(1) + "%";
}
function num(v) {
  if (v === null || v === undefined) return "—";
  return Number(v).toLocaleString();
}
function pctOfRevenue(v, revenue) {
  return pct(revenue ? v / revenue : 0);
}
function pctOfAssets(v, assets) {
  return pct(assets ? v / assets : 0);
}

async function generateReport() {
  const state = document.getElementById("stateSelect").value;
  const naicsText = document.getElementById("naicsInput").value.trim();
  // Resolve the NAICS code three ways, most reliable first:
  // (1) a "(123456)" suffix from a picked suggestion, parsed directly out of
  //     the text rather than looked up in naicsMap (which gets rebuilt/wiped
  //     by the input handler firing again when the suggestion is selected);
  // (2) a direct hit in naicsMap, in case it's still populated;
  // (3) the text itself, if the user typed a bare NAICS code.
  const codeSuffixMatch = naicsText.match(/\((\d{4,6})\)\s*$/);
  const naics = (codeSuffixMatch && codeSuffixMatch[1])
    || naicsMap[naicsText]
    || (/^\d{4,6}$/.test(naicsText) ? naicsText : null);
  const root = document.getElementById("reportRoot");

  if (!naics) {
    root.innerHTML = `<div class="error-box">Pick an industry from the suggestions (or type a NAICS code) before generating a report.</div>`;
    return;
  }

  root.innerHTML = `<div class="loading">Pulling live Census data and building the report…</div>`;
  document.getElementById("generateBtn").disabled = true;

  try {
    const res = await fetch(`${API}/api/report?naics=${encodeURIComponent(naics)}&state=${encodeURIComponent(state)}`);
    const data = await res.json();
    if (!res.ok || data.error) {
      root.innerHTML = `<div class="error-box">${data.error || "Something went wrong generating this report."}</div>`;
      return;
    }
    renderReport(data);
  } catch (err) {
    root.innerHTML = `<div class="error-box">Request failed: ${err.message}</div>`;
  } finally {
    document.getElementById("generateBtn").disabled = false;
  }
}

function renderReport(data) {
  const root = document.getElementById("reportRoot");
  const g = data.industry_at_a_glance;
  const is = data.income_statement_latest;
  const bs = data.balance_sheet;
  const r = data.financial_ratios;

  root.innerHTML = `
    <div class="card">
      <h2>${data.industry.naics_label || "Industry"} <span class="source-tag real">Census data</span></h2>
      <p class="caption">${data.geography.state_name} · NAICS ${data.industry.naics_code} · Modeled with the "${data.industry.sector_profile_used}" sector profile</p>
      <p style="font-size:13.5px; line-height:1.55; color:var(--ink); margin:0 0 18px;">${data.industry_description}</p>
      <div class="glance-grid">
        <div class="glance-stat"><div class="value">${num(g.total_firms)}</div><div class="label">Firms (2022 Economic Census)</div></div>
        <div class="glance-stat"><div class="value">${money(g.total_revenue)}</div><div class="label">Total industry revenue</div></div>
        <div class="glance-stat"><div class="value">${num(g.total_employment)}</div><div class="label">Total employment</div></div>
        <div class="glance-stat"><div class="value">${money(g.total_payroll)}</div><div class="label">Total annual payroll</div></div>
        <div class="glance-stat"><div class="value">${money(g.total_sde)}</div><div class="label">Total SDE, all firms <span class="source-tag modeled" style="margin-left:4px;">Modeled</span></div></div>
        <div class="glance-stat"><div class="value">${money(g.total_net_income)}</div><div class="label">Total net income, all firms <span class="source-tag modeled" style="margin-left:4px;">Modeled</span></div></div>
        <div class="glance-stat"><div class="value">${money(g.average_revenue_per_firm)}</div><div class="label">Est. average revenue / firm (${data.data_sources.cbp_year})</div></div>
        <div class="glance-stat"><div class="value">${g.national_average_revenue_per_firm ? money(g.national_average_revenue_per_firm) : "—"}</div><div class="label">National average revenue / firm</div></div>
      </div>
      <h3 style="font-size:13px; margin:20px 0 8px;">Firms Distribution by Sales Class <span class="source-tag modeled">Modeled</span></h3>
      <p class="caption">Census doesn't publish firm counts by revenue size class at this level of detail, so this splits the real total-firm count using a general small-business size distribution rather than an industry-specific one.</p>
      ${firmDistributionTable(g.firm_distribution, g.total_firms)}
    </div>

    <div class="card">
      <h2>Industry Trends &amp; AI Outlook <span class="source-tag real">Government data</span></h2>
      ${trendsSection(data.industry_trends, data.revenue_projection)}
    </div>

    <div class="card">
      <h2>Revenue &amp; SDE Trend <span class="source-tag modeled">Modeled trend</span></h2>
      <p class="caption">5-year series modeled from the latest average-revenue estimate using observed employment growth. Not measured year-by-year data.</p>
      <canvas id="trendChart"></canvas>
    </div>

    <div class="card">
      <h2>State vs. National Benchmarks <span class="source-tag modeled">Modeled trend</span></h2>
      <p class="caption">5-year modeled trend for Revenue, SDE, EBITDA, Gross Profit, and Pre-Tax Net Profit, per firm. The national line is built the same way as the state line, from real national Census revenue and employment data.</p>
      ${metricTrendsSection(data.metric_trends)}
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Income Statement <span class="source-tag modeled">Modeled</span></h2>
        <p class="caption">% of average revenue, latest year (${data.data_sources.cbp_year})</p>
        ${incomeStatementTable(is)}
      </div>
      <div class="card">
        <h2>Balance Sheet <span class="source-tag modeled">Modeled</span></h2>
        <p class="caption">% of total assets, latest year</p>
        ${balanceSheetTable(bs)}
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Income Statement, 5-Year <span class="source-tag modeled">Modeled</span></h2>
        ${incomeStatementHistoryTable(data.income_statement_history)}
      </div>
      <div class="card">
        <h2>Balance Sheet, 5-Year <span class="source-tag modeled">Modeled</span></h2>
        ${balanceSheetHistoryTable(data.balance_sheet_history)}
      </div>
    </div>

    <div class="card">
      <h2>Financial Ratios <span class="source-tag modeled">Modeled</span></h2>
      <p class="caption">Latest year (${data.data_sources.cbp_year})</p>
      ${ratiosTable(r)}
    </div>

    <div class="card">
      <h2>Financial Ratios, 5-Year <span class="source-tag modeled">Modeled</span></h2>
      ${ratiosHistoryTable(data.ratios_history)}
    </div>

    <div class="card">
      <h2>By Revenue Size Class <span class="source-tag modeled">Modeled</span></h2>
      <p class="caption">Estimated SDE and EBITDA by size class, scaled from the sector profile.</p>
      ${sizeClassTable(data.size_class_estimates)}
    </div>

    <div class="card">
      <h2>By Revenue Size Class, 5-Year <span class="source-tag modeled">Modeled</span></h2>
      <p class="caption">Same modeled growth trend applied within each size class.</p>
      ${sizeClassHistorySection(data.size_class_history)}
    </div>

    <div class="card">
      <h2>Capital Intensity Analysis <span class="source-tag modeled">Modeled</span></h2>
      <p class="caption">Capital intensity measures how many dollars of assets it takes to generate a dollar of revenue (Total Assets ÷ Revenue) — a rough gauge of how "asset-heavy" a business model is. A ratio of 0.30 means $0.30 of assets are needed to generate $1.00 of revenue.</p>
      ${capitalIntensityTable(data.capital_intensity_by_size)}
      <p class="caption" style="margin-top:10px;">This tool applies one modeled capital-structure profile per sector. Unlike revenue and SDE — which are anchored to a real, measured employment/payroll growth rate — we don't have a comparably grounded way to vary capital intensity by year, so it's shown as a current estimate by size class rather than a fabricated historical trend.</p>

      <h3 style="font-size:13px; margin:20px 0 8px;">Reading the ranges</h3>
      <table>
        <thead><tr><th>Range</th><th>General characteristics</th></tr></thead>
        <tbody>
          <tr><td>Below 0.25</td><td>Light on physical assets — typically service-driven businesses with room to scale without heavy capital spending.</td></tr>
          <tr><td>0.25 – 0.35</td><td>A mix of service and physical operations — some equipment or inventory, but not asset-dominated.</td></tr>
          <tr><td>0.35 – 0.45</td><td>Meaningful equipment or working-capital needs — more established, less nimble to scale quickly.</td></tr>
          <tr><td>Above 0.45</td><td>Asset-heavy — significant infrastructure and higher barriers for a new entrant.</td></tr>
        </tbody>
      </table>

      <h3 style="font-size:13px; margin:20px 0 8px;">Why it matters, by audience</h3>
      <div class="glance-grid">
        <div class="glance-stat"><div class="label" style="font-weight:600; color:var(--ink); margin-bottom:4px;">Buyers</div><div class="label">A higher ratio usually means more capital tied up in the business before it starts generating a return.</div></div>
        <div class="glance-stat"><div class="label" style="font-weight:600; color:var(--ink); margin-bottom:4px;">Investors</div><div class="label">Lower-intensity, asset-light models tend to scale more easily and often command different valuation multiples.</div></div>
        <div class="glance-stat"><div class="label" style="font-weight:600; color:var(--ink); margin-bottom:4px;">Lenders</div><div class="label">Higher-intensity businesses typically carry more collateral, but asset quality and liquidity matter just as much as quantity.</div></div>
        <div class="glance-stat"><div class="label" style="font-weight:600; color:var(--ink); margin-bottom:4px;">Advisors</div><div class="label">Capital intensity is one input among many — it should inform the valuation approach, not dictate it on its own.</div></div>
      </div>
    </div>

    <div class="disclaimer">
      <h3>Methodology &amp; disclosures</h3>
      <p>${data.methodology_note}</p>
      <p>${data.data_sources.revenue_scaling_assumption} Implied annual growth used for the trend line: ${data.implied_annual_growth_pct}%.</p>
      <p>This report is generated independently from public U.S. Census Bureau data and general industry-typical financial assumptions. It is not affiliated with, endorsed by, or derived from any third-party proprietary benchmark provider. Figures are estimates for general informational purposes only and should not be used as the sole basis for a valuation, lending, or investment decision.</p>
    </div>
  `;

  renderTrendChart(data.income_statement_history);
}

function firmDistributionTable(dist, totalFirms) {
  const labels = Object.keys(dist);
  return `<table><thead><tr><th>Sales Class</th><th>Firms</th><th>% of Total</th></tr></thead><tbody>
    ${labels.map(l => `<tr><td>${l}</td><td>${num(dist[l].count)}</td><td>${dist[l].pct.toFixed(1)}%</td></tr>`).join("")}
    <tr class="subtotal"><td>Total</td><td>${num(totalFirms)}</td><td>100.0%</td></tr>
  </tbody></table>`;
}

function metricTrendsSection(metricTrends) {
  const order = ["revenue", "sde", "ebitda", "gross_profit", "pretax_net_profit"];
  return order.map((key, idx) => {
    const mt = metricTrends[key];
    if (!mt) return "";
    const years = Object.keys(mt.state_history).sort();
    const hasNational = years.some(y => mt.national_history[y] !== undefined);
    const isLast = idx === order.length - 1;
    return `
      <div style="margin-bottom:${isLast ? "0" : "22px"}; padding-bottom:${isLast ? "0" : "18px"}; border-bottom:${isLast ? "none" : "1px solid var(--line)"};">
        <h3 style="font-size:14px; margin:0 0 8px;">${mt.label}</h3>
        <table>
          <thead><tr><th>Year</th>${years.map(y => `<th>${y}</th>`).join("")}</tr></thead>
          <tbody>
            <tr><td>State</td>${years.map(y => `<td>${money(mt.state_history[y])}</td>`).join("")}</tr>
            ${hasNational ? `<tr><td>United States</td>${years.map(y => `<td>${mt.national_history[y] !== undefined ? money(mt.national_history[y]) : "—"}</td>`).join("")}</tr>` : ""}
          </tbody>
        </table>
        <p class="caption" style="margin-top:8px; margin-bottom:2px;">${mt.state_trend ? mt.state_trend.sentence : ""}</p>
        <p class="caption" style="margin-bottom:0;">${mt.vs_national_note}</p>
      </div>
    `;
  }).join("");
}

function incomeStatementHistoryTable(history) {
  const years = Object.keys(history).sort();
  const rev = y => history[y].revenue;
  const rows = [
    ["Cost of Sales", y => history[y].cost_of_sales],
    ["Gross Profit", y => history[y].gross_profit, 1],
    ["Officers Compensation", y => history[y].opex.officers_compensation],
    ["Salary &amp; Wages", y => history[y].opex.salary_and_wages],
    ["Benefits &amp; Pensions", y => history[y].opex.benefits_and_pensions],
    ["Rent", y => history[y].opex.rent],
    ["Other Expenses", y => history[y].opex.other_expenses],
    ["Depreciation &amp; Amortization", y => history[y].opex.depreciation_and_amortization],
    ["Total Operating Expenses", y => history[y].opex.total, 1],
    ["Operating Income", y => history[y].operating_income, 1],
    ["EBITDA", y => history[y].ebitda, 1],
    ["SDE (Cash Flow)", y => history[y].sde, 1],
    ["Pre-Tax Net Profit", y => history[y].pretax_net_profit, 1],
  ];
  return `<table>
    <thead><tr><th>% of revenue</th>${years.map(y => `<th>${y}</th>`).join("")}</tr></thead>
    <tbody>
      <tr class="subtotal"><td>Business Revenue ($)</td>${years.map(y => `<td>${money(rev(y))}</td>`).join("")}</tr>
      ${rows.map(([label, getter, bold]) => `
        <tr class="${bold ? "subtotal" : ""}"><td>${label}</td>${years.map(y => `<td>${pctOfRevenue(getter(y), rev(y))}</td>`).join("")}</tr>
      `).join("")}
    </tbody>
  </table>`;
}

function balanceSheetHistoryTable(history) {
  const years = Object.keys(history).sort();
  const ta = y => history[y].total_assets;
  const rows = [
    ["Cash", y => history[y].current_assets.cash],
    ["Receivables", y => history[y].current_assets.receivables],
    ["Inventory", y => history[y].current_assets.inventory],
    ["Other Current Assets", y => history[y].current_assets.other],
    ["Total Current Assets", y => history[y].current_assets.total, 1],
    ["Net Fixed Assets", y => history[y].fixed_assets.net],
    ["Other Non-Current Assets", y => history[y].other_non_current_assets],
    ["Accounts Payable", y => history[y].current_liabilities.accounts_payable],
    ["Notes Payable", y => history[y].current_liabilities.notes_payable],
    ["Other Current Liabilities", y => history[y].current_liabilities.other],
    ["Total Current Liabilities", y => history[y].current_liabilities.total, 1],
    ["Long-Term Liabilities", y => history[y].long_term_liabilities],
    ["Total Liabilities", y => history[y].total_liabilities, 1],
    ["Equity", y => history[y].equity, 1],
  ];
  return `<table>
    <thead><tr><th>% of assets</th>${years.map(y => `<th>${y}</th>`).join("")}</tr></thead>
    <tbody>
      <tr class="subtotal"><td>Total Assets ($)</td>${years.map(y => `<td>${money(ta(y))}</td>`).join("")}</tr>
      ${rows.map(([label, getter, bold]) => `
        <tr class="${bold ? "subtotal" : ""}"><td>${label}</td>${years.map(y => `<td>${pctOfAssets(getter(y), ta(y))}</td>`).join("")}</tr>
      `).join("")}
    </tbody>
  </table>`;
}

function ratiosHistoryTable(historyRatios) {
  const years = Object.keys(historyRatios).sort();
  const r = y => historyRatios[y];
  const num2 = v => (v === null || v === undefined) ? "—" : v.toFixed(2);
  const section = (title, rows) => `
    <h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--sub); margin:16px 0 6px;">${title}</h4>
    <table><thead><tr><th>Ratio</th>${years.map(y => `<th>${y}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(([label, getter, fmt]) => `<tr><td>${label}</td>${years.map(y => `<td>${fmt(getter(y))}</td>`).join("")}</tr>`).join("")}
    </tbody></table>
  `;
  return `
    ${section("Cash Flow &amp; Solvency", [
      ["Current Ratio", y => r(y).current_ratio, num2],
      ["Quick Ratio", y => r(y).quick_ratio, num2],
      ["Days Payable", y => r(y).days_payable, v => v ?? "—"],
      ["Net Working Capital", y => r(y).net_working_capital, v => money(v)],
    ])}
    ${section("Profitability", [
      ["EBITDA / Revenue", y => r(y).ebitda_margin_pct, pct],
      ["Pre-Tax Return on Assets", y => r(y).pretax_return_on_assets_pct, pct],
      ["Pre-Tax Return on Net Worth", y => r(y).pretax_return_on_net_worth_pct, pct],
      ["Gross Margin", y => r(y).gross_margin_pct, pct],
    ])}
    ${section("Efficiency", [
      ["Assets / Revenue", y => r(y).assets_to_revenue, num2],
      ["Fixed Asset Turnover", y => r(y).fixed_asset_turnover, num2],
      ["Receivables Turnover", y => r(y).receivables_turnover, num2],
      ["Total Asset Turnover", y => r(y).total_asset_turnover, num2],
      ["Days Working Capital", y => r(y).days_working_capital, v => v ?? "—"],
    ])}
  `;
}

function sizeClassMetricHistoryTable(sizeClassHistory, metricKey, metricLabel) {
  const classLabels = Object.keys(sizeClassHistory);
  const years = Object.keys(sizeClassHistory[classLabels[0]]).sort();
  return `
    <h4 style="font-size:13px; margin:16px 0 6px;">${metricLabel}</h4>
    <table><thead><tr><th>Sales Class</th>${years.map(y => `<th>${y}</th>`).join("")}</tr></thead><tbody>
      ${classLabels.map(cls => `<tr><td>${cls}</td>${years.map(y => `<td>${money(sizeClassHistory[cls][y][metricKey])}</td>`).join("")}</tr>`).join("")}
    </tbody></table>
  `;
}

function sizeClassHistorySection(sizeClassHistory) {
  const metrics = [
    ["revenue", "Revenue"],
    ["sde", "SDE (Cash Flow)"],
    ["ebitda", "EBITDA"],
    ["gross_profit", "Gross Profit"],
    ["pretax_net_profit", "Pre-Tax Net Profit"],
  ];
  return metrics.map(([key, label]) => sizeClassMetricHistoryTable(sizeClassHistory, key, label)).join("");
}

function capitalIntensityTable(byClass) {
  const labels = Object.keys(byClass);
  return `<table><thead><tr>${labels.map(l => `<th>${l}</th>`).join("")}</tr></thead><tbody>
    <tr>${labels.map(l => `<td>${byClass[l].toFixed(2)}</td>`).join("")}</tr>
  </tbody></table>`;
}

function incomeStatementTable(is) {
  const rev = is.revenue;
  const rows = [
    ["Business Revenue", rev, 1],
    ["Cost of Sales", is.cost_of_sales],
    ["Gross Profit", is.gross_profit, 1],
    ["Officers Compensation", is.opex.officers_compensation],
    ["Salary &amp; Wages", is.opex.salary_and_wages],
    ["Benefits &amp; Pensions", is.opex.benefits_and_pensions],
    ["Rent", is.opex.rent],
    ["Other Expenses", is.opex.other_expenses],
    ["Depreciation &amp; Amortization", is.opex.depreciation_and_amortization],
    ["Total Operating Expenses", is.opex.total, 1],
    ["Operating Income", is.operating_income, 1],
    ["Interest Income", is.other.interest_income],
    ["Interest Expense", is.other.interest_expense],
    ["Other Income", is.other.other_income],
    ["EBITDA", is.ebitda, 1],
    ["SDE (Cash Flow)", is.sde, 1],
    ["Pre-Tax Net Profit", is.pretax_net_profit, 1],
  ];
  return `<table><thead><tr><th>Line Item</th><th>Amount</th><th>% of Revenue</th></tr></thead><tbody>
    ${rows.map(([label, val, bold]) => `
      <tr class="${bold ? "subtotal" : ""}"><td>${label}</td><td>${money(val)}</td><td>${pctOfRevenue(val, rev)}</td></tr>
    `).join("")}
  </tbody></table>`;
}

function balanceSheetTable(bs) {
  const ta = bs.total_assets;
  const rows = [
    ["Cash", bs.current_assets.cash],
    ["Receivables", bs.current_assets.receivables],
    ["Inventory", bs.current_assets.inventory],
    ["Other Current Assets", bs.current_assets.other],
    ["Total Current Assets", bs.current_assets.total, 1],
    ["Net Fixed Assets", bs.fixed_assets.net],
    ["Other Non-Current Assets", bs.other_non_current_assets],
    ["Total Assets", ta, 1],
    ["Accounts Payable", bs.current_liabilities.accounts_payable],
    ["Notes Payable", bs.current_liabilities.notes_payable],
    ["Other Current Liabilities", bs.current_liabilities.other],
    ["Total Current Liabilities", bs.current_liabilities.total, 1],
    ["Long-Term Liabilities", bs.long_term_liabilities],
    ["Total Liabilities", bs.total_liabilities, 1],
    ["Equity", bs.equity, 1],
  ];
  return `<table><thead><tr><th>Line Item</th><th>Amount</th><th>% of Assets</th></tr></thead><tbody>
    ${rows.map(([label, val, bold]) => `
      <tr class="${bold ? "subtotal" : ""}"><td>${label}</td><td>${money(val)}</td><td>${pctOfAssets(val, ta)}</td></tr>
    `).join("")}
  </tbody></table>`;
}

function ratiosTable(r) {
  const num2 = v => (v === null || v === undefined) ? "—" : v.toFixed(2);
  const section = (title, rows) => `
    <h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--sub); margin:16px 0 6px;">${title}</h4>
    <table><tbody>${rows.map(([label, val]) => `<tr><td>${label}</td><td>${val}</td></tr>`).join("")}</tbody></table>
  `;
  return `
    ${section("Cash Flow &amp; Solvency", [
      ["Current Ratio", num2(r.current_ratio)],
      ["Quick Ratio", num2(r.quick_ratio)],
      ["Days Payable", r.days_payable ?? "—"],
      ["Net Working Capital", money(r.net_working_capital)],
    ])}
    ${section("Profitability", [
      ["EBITDA / Revenue", pct(r.ebitda_margin_pct)],
      ["Pre-Tax Return on Assets", pct(r.pretax_return_on_assets_pct)],
      ["Pre-Tax Return on Net Worth", pct(r.pretax_return_on_net_worth_pct)],
      ["Gross Margin", pct(r.gross_margin_pct)],
    ])}
    ${section("Efficiency", [
      ["Assets / Revenue (Capital Intensity)", num2(r.capital_intensity)],
      ["Fixed Asset Turnover", num2(r.fixed_asset_turnover)],
      ["Receivables Turnover", num2(r.receivables_turnover)],
      ["Total Asset Turnover", num2(r.total_asset_turnover)],
      ["Days Working Capital", r.days_working_capital ?? "—"],
    ])}
  `;
}

function growthBadge(pct) {
  if (pct === null || pct === undefined) return "—";
  const sign = pct > 0 ? "+" : "";
  const cls = pct > 0 ? "trend-up" : pct < 0 ? "trend-down" : "";
  return `<span class="${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function trendsSection(trends, projection) {
  const nat = trends.national;
  const sec = trends.sector;
  const hasSector = trends.sector_has_data;

  const growthRow = hasSector && sec.employment_growth_2024_2034_pct !== null
    ? { pct: sec.employment_growth_2024_2034_pct, note: sec.growth_note, tag: "Sector-specific" }
    : { pct: nat.employment_growth_2024_2034_pct, note: nat.growth_note, tag: "National average (sector-specific figure not published)" };

  const demandRow = hasSector && sec.output_growth_2024_2034_pct !== null
    ? { pct: sec.output_growth_2024_2034_pct, note: sec.output_growth_note, tag: "Sector-specific" }
    : { pct: nat.output_growth_2024_2034_pct, note: (hasSector && sec.output_growth_note) || nat.output_growth_note, tag: (hasSector && sec.output_growth_note) ? "Partial sector data — see note" : "National average (sector-specific figure not published)" };

  const aiRow = hasSector && sec.ai_current_use_pct !== null
    ? { current: sec.ai_current_use_pct, expected: sec.ai_expected_use_pct, note: sec.ai_note, tag: "Sector-specific" }
    : { current: nat.ai_current_use_pct, expected: nat.ai_expected_use_pct, note: nat.ai_note, tag: "National average (sector-specific figure not published)" };

  const projectionHtml = (projection && projection.projected_revenue)
    ? `
      <div class="calc-box">
        <span class="source-tag calculated" style="margin-left:0; margin-bottom:6px; display:inline-block;">Calculated projection</span>
        <div class="calc-value">${money(projection.projected_revenue)} by ${projection.target_year}</div>
        <div>Projected average revenue per firm, growing this industry's estimated ${money(projection.base_revenue)} (${projection.base_year}) forward at ${projection.annual_growth_rate_pct_used}%/year &mdash; the ${projection.growth_rate_basis} for real demand growth.</div>
        <div style="margin-top:6px; color:#5b6b74;">This figure isn't published by Census or BLS &mdash; it's calculated by this tool by compounding the real Census-based revenue estimate above by the real BLS demand-growth rate over ${projection.years_projected} years. Treat it as a directional "if current demand trends hold" estimate, not a forecast guarantee.</div>
      </div>
    `
    : "";

  return `
    <div class="glance-grid" style="margin-bottom: 16px;">
      <div class="glance-stat">
        <div class="value">${growthBadge(growthRow.pct)}</div>
        <div class="label">Projected employment growth, 2024&ndash;2034 &middot; ${growthRow.tag}</div>
      </div>
      <div class="glance-stat">
        <div class="value">${growthBadge(demandRow.pct)}</div>
        <div class="label">Projected demand growth (real output), 2024&ndash;2034 &middot; ${demandRow.tag}</div>
      </div>
      <div class="glance-stat">
        <div class="value">${aiRow.current !== null && aiRow.current !== undefined ? aiRow.current.toFixed(1) + "%" : "—"}</div>
        <div class="label">Businesses currently using AI &middot; ${aiRow.tag}</div>
      </div>
      <div class="glance-stat">
        <div class="value">${aiRow.expected !== null && aiRow.expected !== undefined ? aiRow.expected.toFixed(1) + "%" : "—"}</div>
        <div class="label">Businesses expecting to use AI within 6 months</div>
      </div>
    </div>
    <p class="caption" style="margin-bottom: 6px;">${growthRow.note || ""}</p>
    <p class="caption" style="margin-bottom: 6px;">${demandRow.note || ""}</p>
    <p class="caption" style="margin-bottom: 6px;">${aiRow.note || ""}</p>
    ${projectionHtml}
    <p class="caption" style="margin-top: 12px; margin-bottom: 0;">
      ${trends.as_of}
      Sources:
      <a href="${trends.sources.employment_growth.url}" target="_blank" rel="noopener">${trends.sources.employment_growth.label}</a>;
      <a href="${trends.sources.output_growth.url}" target="_blank" rel="noopener">${trends.sources.output_growth.label}</a>;
      <a href="${trends.sources.ai_adoption.url}" target="_blank" rel="noopener">${trends.sources.ai_adoption.label}</a>.
      Census also publishes AI adoption by state (all industries combined, not broken out by sector) on its
      <a href="https://www.census.gov/hfp/btos/data" target="_blank" rel="noopener">BTOS data dashboard</a>.
    </p>
  `;
}

function sizeClassTable(sizeClasses) {
  const labels = Object.keys(sizeClasses);
  return `<table><thead><tr><th>Metric</th>${labels.map(l => `<th>${l}</th>`).join("")}</tr></thead><tbody>
    <tr><td>Revenue</td>${labels.map(l => `<td>${money(sizeClasses[l].revenue)}</td>`).join("")}</tr>
    <tr><td>Gross Profit</td>${labels.map(l => `<td>${money(sizeClasses[l].gross_profit)}</td>`).join("")}</tr>
    <tr><td>EBITDA</td>${labels.map(l => `<td>${money(sizeClasses[l].ebitda)}</td>`).join("")}</tr>
    <tr><td>SDE</td>${labels.map(l => `<td>${money(sizeClasses[l].sde)}</td>`).join("")}</tr>
  </tbody></table>`;
}

let trendChartInstance = null;
function renderTrendChart(history) {
  const years = Object.keys(history).sort();
  const revenue = years.map(y => history[y].revenue);
  const sde = years.map(y => history[y].sde);
  const ebitda = years.map(y => history[y].ebitda);

  const ctx = document.getElementById("trendChart");
  if (trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: years,
      datasets: [
        { label: "Revenue", data: revenue, borderColor: "#0f7a63", backgroundColor: "rgba(15,122,99,0.08)", yAxisID: "y", tension: 0.25 },
        { label: "SDE", data: sde, borderColor: "#c98a1b", backgroundColor: "rgba(201,138,27,0.08)", yAxisID: "y1", tension: 0.25 },
        { label: "EBITDA", data: ebitda, borderColor: "#5b6b74", backgroundColor: "rgba(91,107,116,0.08)", yAxisID: "y1", tension: 0.25 },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      scales: {
        y: { position: "left", ticks: { callback: v => "$" + (v/1000).toFixed(0) + "k" }, title: { display: true, text: "Revenue" } },
        y1: { position: "right", grid: { drawOnChartArea: false }, ticks: { callback: v => "$" + (v/1000).toFixed(0) + "k" }, title: { display: true, text: "SDE / EBITDA" } },
      },
    },
  });
}

loadStates();
searchNaics("");
</script>
</body>
</html>
